[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.20"

# 1) Configuración preparada para despliegues reales en redes públicas EVM.
#    Los endpoints se resuelven desde variables de entorno e.g. SEPOLIA_RPC_URL.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
holesky = "${HOLESKY_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
